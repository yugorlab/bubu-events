<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Cover Pro - Mobile Layout</title>
    <!-- Подключаем Russo One для обложки и Montserrat для интерфейса -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --accent-color: #98fb00; 
            --bg-dark: #121212;
            --card-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif; /* Общий шрифт для UI */
        }

        body {
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            color: #fff;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            gap: 20px;
        }

        .controls {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .controls { grid-template-columns: 1fr 1fr; }
            .action-group { grid-column: 1 / -1; }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .control-group input[type="text"], 
        .control-group input[type="file"] {
            background: #151515;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }
        
        .control-group input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .controls button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s, background 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls button:hover { opacity: 0.8; }

        .cover-wrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 3 / 2;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .cover-container {
            width: 900px;
            height: 600px;
            background-color: var(--bg-dark);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 8px solid var(--accent-color);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.9), 
                        inset 0 0 40px var(--accent-color);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
            box-sizing: border-box;
        }

        .bg-custom-image {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background-repeat: repeat;
            background-size: 300px;
            background-position: center;
            opacity: 0.15;
            transform: rotate(90deg);
            z-index: 1;
            pointer-events: none;
        }

        .bg-default-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(
                -90deg, transparent, transparent 40px,
                rgba(255, 255, 255, 0.03) 40px, rgba(255, 255, 255, 0.03) 42px
            );
            z-index: 1;
            pointer-events: none;
        }

        .bg-glow {
            position: absolute;
            width: 800px; height: 800px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 60%);
            opacity: 0.15;
            top: -200px; left: -100px;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        .watermark {
            position: absolute;
            top: 25px;
            font-size: 14px; font-weight: 800;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px; text-transform: uppercase;
            z-index: 10;
        }

        .card-white {
            margin-top: 50px; 
            background: #ffffff;
            padding: 22px 60px;
            border-radius: var(--card-radius);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 80%;
        }

        .card-white h1 {
            color: #111;
            font-size: 42px; 
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            word-break: break-word;
            font-family: 'Russo One', sans-serif; /* Шрифт обложки */
        }

        .card-accent {
            margin-top: -25px; 
            background: var(--accent-color);
            padding: 16px 50px; 
            border-radius: 18px; 
            z-index: 20; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-color);
            text-align: center;
            transition: background 0.5s ease;
            border: 3px solid rgba(255,255,255,0.2);
            max-width: 85%;
        }

        .card-accent h2 {
            color: #ffffff;
            font-size: 26px; 
            font-weight: 800;
            margin: 0 0 4px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            word-break: break-word;
            font-family: 'Russo One', sans-serif; /* Шрифт обложки */
        }

        .card-accent p {
            color: #ffffff;
            font-size: 16px; 
            font-weight: 600;
            opacity: 0.9;
            letter-spacing: 1.5px;
            margin: 0;
            word-break: break-word;
            font-family: 'Russo One', sans-serif; /* Шрифт обложки */
        }

        .prize-container {
            margin-top: 35px; 
            width: 300px; height: 300px; 
            z-index: 5;
            position: relative;
            background: #1e1e1e;
            border-radius: var(--card-radius);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.1);
        }

        .prize-bg {
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: none;
            border-radius: inherit;
        }

        .placeholder-text {
            color: rgba(255,255,255,0.2);
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
        <div class="controls">
            <div class="control-group" style="border: 1px dashed var(--accent-color);">
                <label>Фоновый паттерн (картинка):</label>
                <input type="file" id="bgImageUpload" accept="image/*">
                
                <div class="slider-row" style="margin-top: 10px;">
                    <label style="margin:0;">Размер:</label>
                    <input type="range" id="bgScale" min="50" max="800" value="300">
                    <span id="valScale">300px</span>
                </div>
                
                <div class="slider-row" style="margin-top: 5px;">
                    <label style="margin:0;">Прозрачность:</label>
                    <input type="range" id="bgOpacity" min="0" max="100" value="15">
                    <span id="valOpacity">15%</span>
                </div>
                
                <div class="slider-row" style="margin-top: 5px;">
                    <label style="margin:0;">Поворот:</label>
                    <input type="range" id="bgRotate" min="0" max="360" value="90">
                    <span id="valRotate">90°</span>
                </div>
            </div>

            <div class="control-group">
                <label>Название круга:</label>
                <input type="text" id="inputCommunity" value="ИВЕНТ ОТ КК" maxlength="25">
                
                <label style="margin-top: 10px;">Название ивента:</label>
                <input type="text" id="inputEvent" value="KURSED KITCHEN" maxlength="30">
                
                <label style="margin-top: 10px;">Даты:</label>
                <input type="text" id="inputDates" value="26 ОКТЯБРЯ – 31 ОКТЯБРЯ" maxlength="35">
            </div>

            <div class="control-group">
                <label>Картинка приза:</label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <div class="action-group">
                <button id="downloadBtn">Скачать PNG</button>
            </div>
        </div>

        <!-- ОБЛОЖКА -->
        <div class="cover-wrapper" id="coverWrapper">
            <div class="cover-container" id="cover">
                
                <div class="bg-custom-image" id="bgCustomImage"></div>
                <div class="bg-default-pattern" id="bgDefaultPattern"></div>
                <div class="bg-glow" id="bgGlow"></div>

                <div class="watermark">@KYODOEVENTS</div>

                <div class="card-white">
                    <h1 id="displayCommunity">ИВЕНТ ОТ КК</h1>
                </div>

                <div class="card-accent" id="accentCard">
                    <h2 id="displayEvent">KURSED KITCHEN</h2>
                    <p id="displayDates">26 ОКТЯБРЯ – 31 ОКТЯБРЯ</p>
                </div>

                <div class="prize-container">
                    <span class="placeholder-text" id="placeholder">КАРТИНКА<br>ПРИЗА</span>
                    <div id="prizeImage" class="prize-bg"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="colorCanvas" style="display: none;"></canvas>

    <script>
        function resizeCover() {
            const wrapper = document.getElementById('coverWrapper');
            const cover = document.getElementById('cover');
            const scale = wrapper.clientWidth / 900;
            cover.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeCover);
        window.addEventListener('load', resizeCover);

        const inputCommunity = document.getElementById('inputCommunity');
        const inputEvent = document.getElementById('inputEvent');
        const inputDates = document.getElementById('inputDates');

        const displayCommunity = document.getElementById('displayCommunity');
        const displayEvent = document.getElementById('displayEvent');
        const displayDates = document.getElementById('displayDates');

        // --- СОХРАНЕНИЕ И ЗАГРУЗКА НАСТРОЕК ---
        function saveSettings() {
            const settings = {
                community: document.getElementById('inputCommunity').value,
                event: document.getElementById('inputEvent').value,
                dates: document.getElementById('inputDates').value,
                bgScale: document.getElementById('bgScale').value,
                bgOpacity: document.getElementById('bgOpacity').value,
                bgRotate: document.getElementById('bgRotate').value,
                bgImage: document.getElementById('bgCustomImage').style.backgroundImage || '',
                prizeImage: document.getElementById('prizeImage').style.backgroundImage || ''
            };
            localStorage.setItem('eventCoverSettings', JSON.stringify(settings));
        }
        
        function loadSettings() {
            const saved = localStorage.getItem('eventCoverSettings');
            if (!saved) return;
            const s = JSON.parse(saved);

            // Восстанавливаем текст
            if (s.community) { document.getElementById('inputCommunity').value = s.community; document.getElementById('displayCommunity').textContent = s.community; }
            if (s.event) { document.getElementById('inputEvent').value = s.event; document.getElementById('displayEvent').textContent = s.event; }
            if (s.dates) { document.getElementById('inputDates').value = s.dates; document.getElementById('displayDates').textContent = s.dates; }

            // Восстанавливаем настройки фона
            if (s.bgScale) { document.getElementById('bgScale').value = s.bgScale; document.getElementById('valScale').textContent = s.bgScale + 'px'; document.getElementById('bgCustomImage').style.backgroundSize = s.bgScale + 'px'; }
            if (s.bgOpacity) { document.getElementById('bgOpacity').value = s.bgOpacity; document.getElementById('valOpacity').textContent = s.bgOpacity + '%'; document.getElementById('bgCustomImage').style.opacity = s.bgOpacity / 100; }
            if (s.bgRotate) { document.getElementById('bgRotate').value = s.bgRotate; document.getElementById('valRotate').textContent = s.bgRotate + '°'; document.getElementById('bgCustomImage').style.transform = `rotate(${s.bgRotate}deg)`; }

            // Восстанавливаем фоновый паттерн
            if (s.bgImage) {
                document.getElementById('bgCustomImage').style.backgroundImage = s.bgImage;
                document.getElementById('bgDefaultPattern').style.display = 'none';
            }
            
            // Восстанавливаем картинку приза И ЦВЕТ
            if (s.prizeImage) {
                const prizeImg = document.getElementById('prizeImage');
                prizeImg.style.backgroundImage = s.prizeImage;
                prizeImg.style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';

                // Извлекаем URL из строки url("data:image...")
                const imgSrc = s.prizeImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
                const img = new Image();
                img.onload = function() {
                    extractColor(img); // Восстанавливаем цвет при загрузке
                };
                img.src = imgSrc;
            }
        }
        
        // Вызываем загрузку при старте
        loadSettings();

        function updateText(inputElement, displayElement, fallbackText) {
            inputElement.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                displayElement.textContent = val !== '' ? val : fallbackText;
                saveSettings();
            });
        }

        updateText(inputCommunity, displayCommunity, 'НАЗВАНИЕ КРУГА');
        updateText(inputEvent, displayEvent, 'НАЗВАНИЕ ИВЕНТА');
        updateText(inputDates, displayDates, 'ДАТЫ');

        const bgImageUpload = document.getElementById('bgImageUpload');
        const bgCustomImage = document.getElementById('bgCustomImage');
        const bgDefaultPattern = document.getElementById('bgDefaultPattern');
        
        const bgScale = document.getElementById('bgScale');
        const valScale = document.getElementById('valScale');
        const bgOpacity = document.getElementById('bgOpacity');
        const valOpacity = document.getElementById('valOpacity');
        const bgRotate = document.getElementById('bgRotate');
        const valRotate = document.getElementById('valRotate');

        bgImageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                bgCustomImage.style.backgroundImage = `url(${event.target.result})`;
                bgDefaultPattern.style.display = 'none';
                saveSettings();
            }
            reader.readAsDataURL(file);
        });

        bgScale.addEventListener('input', function(e) {
            const val = e.target.value;
            valScale.textContent = val + 'px';
            bgCustomImage.style.backgroundSize = `${val}px`;
            saveSettings();
        });

        bgOpacity.addEventListener('input', function(e) {
            const val = e.target.value;
            valOpacity.textContent = val + '%';
            bgCustomImage.style.opacity = val / 100;
            saveSettings();
        });

        bgRotate.addEventListener('input', function(e) {
            const val = e.target.value;
            valRotate.textContent = val + '°';
            bgCustomImage.style.transform = `rotate(${val}deg)`;
            saveSettings();
        });

        // --- ЛОГИКА КАРТИНКИ ПРИЗА ---
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const prizeImg = document.getElementById('prizeImage');
                    prizeImg.style.backgroundImage = `url(${img.src})`;
                    prizeImg.style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                    extractColor(img);
                    saveSettings();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function extractColor(img) {
            const canvas = document.getElementById('colorCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 50; canvas.height = 50;
            ctx.drawImage(img, 0, 0, 50, 50);
            const imageData = ctx.getImageData(0, 0, 50, 50).data;

            let maxScore = 0;
            let dominantColor = { r: 152, g: 251, b: 0 };

            for (let i = 0; i < imageData.length; i += 4) {
                const r = imageData[i], g = imageData[i + 1], b = imageData[i + 2], a = imageData[i + 3];
                if (a < 128) continue;

                const brightness = (r * 0.299 + g * 0.587 + b * 0.114);
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const saturation = max - min;

                if (brightness > 40 && brightness < 220 && saturation > 60) {
                    const score = brightness + (saturation * 2);
                    if (score > maxScore) {
                        maxScore = score;
                        dominantColor = { r, g, b };
                    }
                }
            }

            const accentRgb = `rgb(${dominantColor.r}, ${dominantColor.g}, ${dominantColor.b})`;
            document.documentElement.style.setProperty('--accent-color', accentRgb);
            document.getElementById('downloadBtn').style.background = accentRgb;
            
            const brightness = (dominantColor.r * 299 + dominantColor.g * 587 + dominantColor.b * 114) / 1000;
            const textColor = brightness > 180 ? '#111111' : '#ffffff'; 
            
            const cardAccent = document.getElementById('accentCard');
            cardAccent.querySelector('h2').style.color = textColor;
            cardAccent.querySelector('p').style.color = textColor;
        }

        // --- СКАЧИВАНИЕ PNG ---
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const originalCover = document.getElementById('cover');
            const btn = this;

            btn.textContent = 'Сохранение...';
            btn.disabled = true;

            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'fixed';
            tempContainer.style.top = '0';
            tempContainer.style.left = '-9999px';
            tempContainer.style.width = '900px';
            tempContainer.style.height = '600px';
            tempContainer.style.zIndex = '-9999';

            const clone = originalCover.cloneNode(true);
            clone.style.transform = 'none';
            clone.style.position = 'relative';
            clone.style.top = '0';
            clone.style.left = '0';
            clone.style.width = '900px';
            clone.style.height = '600px';
            clone.style.margin = '0';

            tempContainer.appendChild(clone);
            document.body.appendChild(tempContainer);

            setTimeout(() => {
                html2canvas(clone, {
                    scale: 2, 
                    width: 900,
                    height: 600,
                    backgroundColor: '#121212',
                    useCORS: true,
                    logging: false,
                    scrollX: 0,
                    scrollY: 0
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'event_cover.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    document.body.removeChild(tempContainer);
                    btn.textContent = 'Скачать PNG';
                    btn.disabled = false;
                }).catch(err => {
                    if(document.body.contains(tempContainer)) {
                        document.body.removeChild(tempContainer);
                    }
                    btn.textContent = 'Скачать PNG';
                    btn.disabled = false;
                    alert("Ошибка при сохранении: " + err);
                });
            }, 100);
        });
    </script>
</body>
</html>
